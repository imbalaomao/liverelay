name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 手动构建时使用的版本号（例如 v0.1.0-test）
        required: true
        default: v0.0.0-manual

permissions:
  contents: write # 需要写权限才能创建 Release

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  WAILS_VERSION: v2.15.0

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: 确定版本号
        id: ver
        shell: bash
        run: echo "value=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: 构建
        # 版本号注入 main.version；不注入的话界面上会一直显示 "dev"
        shell: bash
        run: wails build -clean -ldflags "-X main.version=${{ steps.ver.outputs.value }}"

      - name: 校验产物
        shell: bash
        run: |
          test -f build/bin/LiveRelay.exe || { echo "没有产出 exe"; exit 1; }
          ls -lh build/bin/LiveRelay.exe

      - name: 生成校验和
        # 让下载者能确认拿到的文件没被掉包
        shell: bash
        working-directory: build/bin
        run: sha256sum LiveRelay.exe > LiveRelay.exe.sha256

      - name: 判定是否预发布
        id: kind
        # 两种情况算预发布，不靠人记得手动勾：
        #   1. 标签带后缀（v0.1.0-prototype / -alpha / -rc.1 之类）
        #   2. 主版本号为 0 —— 按 semver 约定，0.x 本身就意味着接口随时会变
        # 判错的代价是不对称的：把预发布标成正式版，会让人当稳定版用。
        shell: bash
        run: |
          v='${{ steps.ver.outputs.value }}'
          if [[ "$v" == *-* || "$v" == v0.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.value }}
          name: LiveRelay ${{ steps.ver.outputs.value }}
          prerelease: ${{ steps.kind.outputs.prerelease }}
          # 预发布本身已经写着"别当稳定版用"，不必再加一道草稿闸门；
          # 正式版才需要人工过目一遍再发
          draft: ${{ steps.kind.outputs.prerelease == 'false' }}
          generate_release_notes: true
          files: |
            build/bin/LiveRelay.exe
            build/bin/LiveRelay.exe.sha256
          body: |
            > **原型版本**。功能已跑通，但尚未在目标硬件上验证，也没有经过长期
            > 挂机考验。可以拿来试用与反馈，不建议用在真要紧的直播上。

            ## 使用前须知

            - 需要 Windows 10 1809 及以上，并已安装 WebView2 Runtime（Win11 自带）
            - 首次运行前请准备好三个内核，放到数据目录的 `tools/` 下，
              或在「内核」页点「检查更新」直接下载：
              - `tools/streamlink/bin/streamlink.exe`（官方 Windows 便携包整包解压，
                它依赖同目录的内嵌 Python，只取 exe 跑不起来）
              - `tools/yt-dlp.exe`
              - `tools/ffmpeg.exe`
            - 想用便携模式就在 exe 同级建一个 `data/` 目录，一切数据都会放在里面，
              删掉即卸载；否则数据落在 `%APPDATA%\LiveRelay`

            下载后可用 `LiveRelay.exe.sha256` 核对完整性。

            ## 这个版本验证到什么程度

            - 全仓 420+ 用例，含竞态检测，每次提交由 CI 在 Windows 上跑
            - 完整推流链路用真实直播源实测打通（抓流内核 → OS 管道 → ffmpeg → RTMP）
            - 2 路并发推流 30 秒，Go 侧堆峰值 0.8MB
            - XSS 注入载荷实测以纯文本渲染；gosec 高危项为 0

            ## 已知限制

            - **未在低配机器上验证**：所有资源数据来自开发机，8GB 内存的目标机上
              需要复测，尤其是 WebView2 的内存占用会随可用内存变化
            - **未向公开平台真实推流**：只推到过本地接收端，微博 / B 站等平台的
              实际转推还需要你自己试
            - 空载内存约 336MB，其中约 300MB 是 WebView2 的固定开销，暂时压不下去
            - Twitch 在国内网络下直连不通，需要配代理
