name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 手动构建时使用的版本号（例如 v0.1.0-test）
        required: true
        default: v0.0.0-manual

permissions:
  contents: write # 需要写权限才能创建 Release

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  WAILS_VERSION: v2.15.0

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: 确定版本号
        id: ver
        shell: bash
        run: echo "value=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: 构建
        # 版本号注入 main.version；不注入的话界面上会一直显示 "dev"
        shell: bash
        run: wails build -clean -ldflags "-X main.version=${{ steps.ver.outputs.value }}"

      - name: 校验产物
        shell: bash
        run: |
          test -f build/bin/LiveRelay.exe || { echo "没有产出 exe"; exit 1; }
          ls -lh build/bin/LiveRelay.exe

      - name: 生成校验和
        # 让下载者能确认拿到的文件没被掉包
        shell: bash
        working-directory: build/bin
        run: sha256sum LiveRelay.exe > LiveRelay.exe.sha256

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.value }}
          name: LiveRelay ${{ steps.ver.outputs.value }}
          draft: true # 先建成草稿，自己看过再发布
          generate_release_notes: true
          files: |
            build/bin/LiveRelay.exe
            build/bin/LiveRelay.exe.sha256
          body: |
            ## 使用前须知

            - 需要 Windows 10 1809 及以上，并已安装 WebView2 Runtime（Win11 自带）
            - 首次运行前请准备好三个内核，放到数据目录的 `tools/` 下，
              或在「内核」页点「检查更新」直接下载：
              - `tools/streamlink/bin/streamlink.exe`（官方 Windows 便携包整包解压，
                它依赖同目录的内嵌 Python，只取 exe 跑不起来）
              - `tools/yt-dlp.exe`
              - `tools/ffmpeg.exe`
            - 想用便携模式就在 exe 同级建一个 `data/` 目录，一切数据都会放在里面，
              删掉即卸载；否则数据落在 `%APPDATA%\LiveRelay`

            下载后可用 `LiveRelay.exe.sha256` 核对完整性。
